name: Deploy the reward function

# Run by hand (Actions → Deploy the reward function → Run workflow). It builds the game engine, bundles it with the
# Edge Function and deploys it to the Supabase project. Needs one repository secret, SUPABASE_ACCESS_TOKEN
# (Supabase dashboard → Account → Access Tokens); see supabase/README.md.
on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Supabase project reference (the part of the project URL before .supabase.co)
        default: pnqbeiicririgfavhqxm
        required: true

concurrency:
  group: deploy-reward
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Build the engine and copy it next to the function
        run: supabase/functions/reward/build.sh
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Add the SUPABASE_ACCESS_TOKEN repository secret first."; exit 1; }
          supabase functions deploy reward --project-ref "${{ inputs.project_ref }}" --use-api
