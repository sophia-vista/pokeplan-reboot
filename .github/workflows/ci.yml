name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Tests and builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: VERSION is MAJOR.MINOR.PATCH
        run: grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (JVM) and the web and JavaScript builds
        run: ./gradlew jvmTest compileKotlinWasmJs jsProductionLibraryCompileSync :composeApp:compileKotlinJvm --no-daemon
      - name: Android debug app
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew :androidApp:assembleDebug --no-daemon
      # A convenience copy only: when the account's artifact storage is full, the upload fails, and that must not fail
      # the PR or skip the checks after it.
      - name: Keep the APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pokeplan-debug-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: 7
      - name: The compiled engine matches the JVM (Node)
        run: node tools/server/smoke.mjs pokemon-core/build/compileSync/js/main/productionLibrary/kotlin
      - name: The reward function's logic (Node)
        run: node --experimental-strip-types supabase/functions/reward/core.test.ts

  supabase:
    name: Supabase schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrations and SQL tests (PostgreSQL 16)
        run: supabase/tests/run.sh

  data:
    name: Generated data is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate the Pokédex data
        run: python3 -I tools/species/generate.py
      - name: Fail if it changed
        run: git diff --exit-code -- pokemon-core/src/commonMain/kotlin/app/pokeplan/core/dex/generated
