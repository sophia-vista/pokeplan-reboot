name: Latest APK

# Every merge to main builds the Android app and replaces the "latest" release with it, so the newest version can be
# downloaded on a phone from the repository's Releases page.
on:
  push:
    branches: [main]

permissions:
  contents: write

# Two merges close together must not delete each other's release halfway; the newer one wins.
concurrency:
  group: latest-apk
  cancel-in-progress: true

jobs:
  apk:
    name: Build and publish the APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew :androidApp:assembleDebug --no-daemon
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk pokeplan.apk
      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest pokeplan.apk --prerelease --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d). Debug build for private use; download pokeplan.apk on your phone and install it."
