name: Latest APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".claude/**"
      - ".idea/**"
      - "legacy-android/**"

permissions:
  contents: write

concurrency:
  group: latest-apk
  cancel-in-progress: true

jobs:
  apk:
    name: Build and publish the APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        env:
          GRADLE_BUILD_ACTION_CACHE_KEY_PREFIX: pokeplan
          GRADLE_BUILD_ACTION_CACHE_KEY_JOB: gradle
      - name: Version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "VERSION must be MAJOR.MINOR.PATCH, got '$VERSION'"; exit 1; }
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          # The "build N" shown in Settings -> About and in the release title. It is a label only: the Android
          # versionCode comes from VERSION, so a run number can never leave a release unable to install (downgrade).
          POKEPLAN_BUILD: ${{ github.run_number }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew :androidApp:assembleDebug --no-daemon
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk pokeplan.apk
          cp pokeplan.apk "pokeplan-v${{ steps.version.outputs.name }}.apk"
      - name: Write the update manifest
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          # The app reads this small file first (Me -> Settings -> About -> Updates) to learn of the build, its size
          # and its checksum without touching the 120 MB APK, and without the GitHub API's unauthenticated rate limit.
          SHA="$(sha256sum pokeplan.apk | cut -d' ' -f1)"
          SIZE="$(stat -c%s pokeplan.apk)"
          printf '{"version":"%s","build":%s,"apk":"pokeplan.apk","size":%s,"sha256":"%s","commit":"%s","date":"%s"}\n' \
            "$VERSION" "${{ github.run_number }}" "$SIZE" "$SHA" "${GITHUB_SHA::7}" "$(date -u +%F)" > update.json
      # The version's own release is published before the rolling one: the app reads the rolling release only to learn
      # which version is newest, then takes its APK and small update patches from the version's release. Creating them
      # in this order means the app never sees a version whose release is not ready yet.
      - name: Publish this version's own release (once per version)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG already has its release; bump VERSION to publish a new one."
            exit 0
          fi
          mkdir -p versioned patches old
          cp "pokeplan-v$VERSION.apk" "versioned/pokeplan-v$VERSION.apk"
          # Patches from the last three versioned APKs, so a phone that skipped a version can take the small update.
          PREV="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=40" --jq '.[].tag_name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v -x "$TAG" | head -3 || true)"
          for previous in $PREV; do
            if ! gh release download "$previous" -p 'pokeplan-v*.apk' -D "old/$previous" 2>/dev/null; then
              echo "No APK in $previous to patch from."
              continue
            fi
            gh release download "$previous" -p update.json -D "old/$previous" 2>/dev/null || true
            old_apk="$(find "old/$previous" -name 'pokeplan-v*.apk' | head -1)"
            if python3 tools/update/make_patch.py --from "$old_apk" --to "versioned/pokeplan-v$VERSION.apk" \
                --out "patches/patch-${previous#v}-to-$VERSION.patch.gz" --quiet; then
              echo "Wrote the patch from $previous."
            else
              echo "No patch from $previous."
            fi
          done
          python3 tools/update/write_release_manifest.py --version "$VERSION" --build "$BUILD_NUMBER" \
            --commit "${GITHUB_SHA::7}" --date "$(date -u +%F)" --apk "versioned/pokeplan-v$VERSION.apk" \
            --patches 'patches/*.patch.gz' --old-dir old --out versioned/update.json
          FILES=("versioned/pokeplan-v$VERSION.apk" "versioned/update.json")
          for patch in patches/*.patch.gz; do
            if [ -f "$patch" ]; then FILES+=("$patch"); fi
          done
          PRE_FLAG=""; [ "${VERSION%%.*}" = "0" ] && PRE_FLAG="--prerelease"
          gh release create "$TAG" "${FILES[@]}" $PRE_FLAG --target "$GITHUB_SHA" \
            --title "PokéPlan v$VERSION" --generate-notes
      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest pokeplan.apk update.json --prerelease --target "$GITHUB_SHA" \
            --title "Latest build (v$VERSION, build ${{ github.run_number }})" \
            --notes "Version $VERSION, build ${{ github.run_number }}, from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d). Debug build for private use. The app updates itself (Me, Settings, About, Updates); an older app downloads pokeplan.apk here once."
