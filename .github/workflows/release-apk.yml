name: Latest APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".claude/**"
      - ".idea/**"
      - "legacy-android/**"

permissions:
  contents: write

concurrency:
  group: latest-apk
  cancel-in-progress: true

jobs:
  apk:
    name: Build and publish the APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        env:
          GRADLE_BUILD_ACTION_CACHE_KEY_PREFIX: pokeplan
          GRADLE_BUILD_ACTION_CACHE_KEY_JOB: gradle
      - name: Version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "VERSION must be MAJOR.MINOR.PATCH, got '$VERSION'"; exit 1; }
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          POKEPLAN_BUILD: ${{ github.run_number }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew :androidApp:assembleDebug --no-daemon
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk pokeplan.apk
          cp pokeplan.apk "pokeplan-v${{ steps.version.outputs.name }}.apk"
      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest pokeplan.apk --prerelease --target "$GITHUB_SHA" \
            --title "Latest build (v$VERSION, build ${{ github.run_number }})" \
            --notes "Version $VERSION, build ${{ github.run_number }}, from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d). Debug build for private use; download pokeplan.apk on your phone and install it."
      - name: Publish this version's own release (once per version)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION already has its release; bump VERSION to publish a new one."
          else
            PRE=""; [ "${VERSION%%.*}" = "0" ] && PRE="--prerelease"
            gh release create "v$VERSION" "pokeplan-v$VERSION.apk" $PRE --target "$GITHUB_SHA" \
              --title "PokéPlan v$VERSION" --generate-notes
          fi
